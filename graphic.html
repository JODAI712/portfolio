<!-- Lightbox -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" aria-label="Close">✕</button>
  <img class="lightbox-img" alt="preview">
</div>

<script>
  (function () {
    const lb = document.getElementById('lightbox');
    const lbImg = lb.querySelector('.lightbox-img');
    const closeBtn = lb.querySelector('.lightbox-close');

    function openLightbox(src, alt){
      lbImg.src = src;
      lbImg.alt = alt || 'preview';
      lb.classList.add('show');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(){
      lb.classList.remove('show');
      lb.setAttribute('aria-hidden', 'true');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    // คลิกที่รูปในงานกราฟิกให้เปิด
    document.addEventListener('click', (e) => {
      const img = e.target.closest('.project-card img');
      if (img) openLightbox(img.src, img.alt);

      // คลิกพื้นหลัง (ไม่ใช่รูป) ให้ปิด
      if (e.target === lb) closeLightbox();
    });

    closeBtn.addEventListener('click', closeLightbox);

    // กด ESC ปิด
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lb.classList.contains('show')) closeLightbox();
    });
  })();
</script>
